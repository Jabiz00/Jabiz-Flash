name: Jabiz Flash Paper Trading

on:
  push:
    branches: [main]
    paths:
      - "flash/**"
      - "config/**"
      - "pyproject.toml"
      - ".github/workflows/paper-trading.yml"
  workflow_dispatch:
  schedule:
    - cron: "3-59/5 * * * *"

permissions:
  contents: write

concurrency:
  group: jabiz-flash-validation-data
  cancel-in-progress: false

jobs:
  paper-session:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: pip install -e .
      - name: Initialize 14-day validation window
        run: python -m flash.validation init
      - name: Run paper trading session
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
        run: python -m flash --duration-seconds 230
      - name: Verify dashboard heartbeat
        run: |
          python -c "import json,time; d=json.load(open('dashboard/status.json')); age=time.time()-float(d['updated_at']); print(f'Dashboard status age: {age:.0f}s'); assert age < 120"
      - name: Save paper-trading state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ dashboard/status.json
          if git diff --cached --quiet; then
            echo "No state changes to save."
          else
            git commit -m "Update Jabiz Flash paper trading state"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
