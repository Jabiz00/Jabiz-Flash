
name: Extract Jabiz Flash Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path

          archive = Path("Jabiz-Flash-paper-trading.zip")
          if not archive.exists():
              raise SystemExit("Project ZIP not found!")

          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  path = Path(item.filename)

                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit("Unsafe ZIP path detected!")

                  if len(path.parts) < 2 or path.parts[0] != "Jabiz-Flash":
                      continue

                  relative = Path(*path.parts[1:])
                  if not relative.parts:
                      continue

                  destination = Path(".") / relative
                  if item.is_dir():
                      destination.mkdir(parents=True, exist_ok=True)
                  else:
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      destination.write_bytes(z.read(item))

          archive.unlink()
          print("Jabiz Flash extraction completed!")
          PY

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract Jabiz Flash project" || echo "No changes to commit"
          git push
