
name: Install Jabiz Flash ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and install project
        run: |
          ZIP="Jabiz-Flash-Updated.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: ZIP file not found."
            exit 1
          fi

          mkdir -p /tmp/jabiz-install

          unzip -q "$ZIP" -d /tmp/jabiz-install

          PROJECT_FILE=$(find /tmp/jabiz-install -name pyproject.toml -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Could not locate pyproject.toml."
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$PROJECT_FILE")

          echo "Installing project from: $PROJECT_ROOT"

          rsync -a "$PROJECT_ROOT/" ./ \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            --exclude='__pycache__/' \
            --exclude='*.py[cod]' \
            --exclude='.pytest_cache/' \
            --exclude='Jabiz-Flash-Updated.zip'

          rm "$ZIP"

      - name: Verify installation
        run: |
          test -f pyproject.toml
          test -f flash/engine.py
          test -f flash/market.py
          test -f dashboard/index.html
          test -d tests

          echo "Jabiz Flash project files installed successfully."

      - name: Commit installed project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Install updated Jabiz Flash project"

          git push origin HEAD:main
